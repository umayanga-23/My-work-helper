server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: personal-workspace-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/workspacedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

supabase:
  url: ${SUPABASE_URL:https://ngeokbpgmtqbijjvonnw.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:workspace-documents}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

logging:
  level:
    root: INFO
    com.personal.workspace: INFO
